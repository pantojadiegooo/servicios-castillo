# ==============================================================================
# GRUPO CASTILLO — NGINX VIRTUAL HOST: api.grupocastillo.mx (v1.1)
# ==============================================================================

# Zonas de Rate Limiting
limit_req_zone $binary_remote_addr zone=castillo_api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=castillo_api_auth:10m rate=5r/m;

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.grupocastillo.mx;

    # Desafío ACME para renovación automática de certificados Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.grupocastillo.mx;

    # Certificados SSL / TLS (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.grupocastillo.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.grupocastillo.mx/privkey.pem;

    # Parámetros Criptográficos Modernos (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de Seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Tamaño máximo de carga para documentos del expediente digital (25MB)
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Bloqueo de acceso directo a archivos ocultos y SQLite
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Endpoint de Autenticación OTP con Rate Limiting Estricto
    location /api/auth/otp {
        limit_req zone=castillo_api_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API General y Webhooks
    location / {
        limit_req zone=castillo_api_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
